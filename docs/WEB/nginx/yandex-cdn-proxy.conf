# Include inside the dedicated WEB location, alongside proxy_pass and identity headers.
proxy_method $telemt_cdn_method;
proxy_set_header X-Telemt-CDN-Method "";
proxy_pass_request_headers on;
proxy_pass_request_body on;

# Preserve the incoming body and Content-Type, including their absence on down/cleanup.
proxy_cache off;
proxy_buffering off;
proxy_request_buffering off;
proxy_next_upstream off;
proxy_connect_timeout 5s;
proxy_send_timeout 65s;
proxy_read_timeout 65s;

proxy_hide_header Cache-Control;
proxy_hide_header Pragma;
proxy_hide_header Expires;
add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
add_header Pragma "no-cache" always;
add_header Expires "0" always;
