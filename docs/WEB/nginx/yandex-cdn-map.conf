# Include inside http {}. Only the cleanup operation uses a marker.
map_hash_bucket_size 64;

map "$uri|$request_method|$http_x_telemt_cdn_method" $telemt_cdn_method {
    default                          $request_method;
    "/api/v1/session|OPTIONS|"        POST;
    "/api/v1/up|OPTIONS|"             POST;
    "/api/v1/down|GET|"               POST;
    "/api/v1/session|OPTIONS|DELETE"  DELETE;
}
